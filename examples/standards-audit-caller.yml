name: Standards Audit

on:
  pull_request:
    branches: [main]

concurrency:
  group: standards-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Standards audit gate
    permissions:
      contents: read
    # Reuse the offline standards-audit gate. PIN the reference (Constitution
    # I-2): replace <FULL-COMMIT-SHA> with the released commit SHA, or tag a
    # release (e.g. @v1.0.0). Never use an unpinned branch (e.g. @main).
    uses: <YOUR-ORG>/<AUDIT-REPO>/.github/workflows/standards-audit.yml@<FULL-COMMIT-SHA>
    with:
      # app-k8s | app | library — must match this repository's shape
      repo-profile: app-k8s
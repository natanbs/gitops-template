apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-demo-sync
  namespace: apps-ns
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: sync
            image: registry.local:5000/audit-demo:v1.0.0
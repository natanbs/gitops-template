apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audit-demo
  namespace: apps-ns
spec:
  rules:
  - host: audit-demo.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: audit-demo
            port:
              number: 8080
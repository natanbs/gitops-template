apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cluster-app-external-secret
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cluster-store
    kind: ClusterSecretStore
  target:
    name: cluster-app-secret
    creationPolicy: Owner
  data:
    - secretKey: MY_KEY
      remoteRef:
        key: /shared/app/MY_KEY

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: legacy-external-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ops-provisioned-store
    kind: SecretStore
  target:
    name: legacy-secret
  data:
    - secretKey: KEY
      remoteRef:
        key: /legacy/app/KEY

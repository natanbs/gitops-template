apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-store
spec:
  provider:
    vault:
      server: https://vault.example.com
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: /v1/auth/kubernetes
          role: my-app-role
          serviceAccountRef:
            name: my-app-sa

apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: open-code-zen/my-app:latest
          env:
            - name: MY_KEY
              valueFrom:
                secretKeyRef:
                  name: my-app-secret
                  key: MY_KEY

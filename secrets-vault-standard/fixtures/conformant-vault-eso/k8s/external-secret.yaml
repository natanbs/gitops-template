apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: my-app-external-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-store
    kind: SecretStore
  target:
    name: my-app-secret
  data:
    - secretKey: MY_KEY
      remoteRef:
        key: /prod/my-app/MY_KEY
